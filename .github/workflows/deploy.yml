name: Deploy portfolio.webziq.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on webziq production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e
            bash /root/deploy-portfolio.sh
            echo ""
            echo "Live: https://portfolio.webziq.com"
            echo "Origin head: $(cd /var/www/cloudsites-portfolio && git rev-parse --short HEAD)"
